name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version: '1.25'

      # Workspace-aware: resolve the go.work members, then build/vet/test each.
      - name: go work sync
        run: go work sync

      - name: Build
        run: go build ./...
        working-directory: packages/devhex

      - name: Vet
        run: go vet ./...
        working-directory: packages/devhex

      - name: Test
        run: go test ./...
        working-directory: packages/devhex
