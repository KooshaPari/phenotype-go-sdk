name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version: '1.26.4'

      # Workspace-aware: resolve the go.work members, then build/vet/test each.
      - name: go work sync
        run: go work sync

      - name: Build
        run: go build ./...
        working-directory: packages/devhex

      - name: Vet
        run: go vet ./...
        working-directory: packages/devhex

      # Run tests with the race detector enabled (L7/L8 — runtime safety gates).
      - name: Test (race detector)
        run: go test -race ./...
        working-directory: packages/devhex

  staticcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version: '1.26.4'

      - name: go work sync
        run: go work sync

      # staticcheck (L31 static analysis gate).
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
        working-directory: packages/devhex

  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version: '1.26.4'

      - name: go work sync
        run: go work sync

      # govulncheck scans for known CVEs in Go module dependencies (L9/L28/L40 supply-chain gate).
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: packages/devhex
